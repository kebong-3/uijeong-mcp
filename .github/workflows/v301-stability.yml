name: v3.0.1 stability verification
on:
  push:
    branches: [stability-v3.0.1-20260929]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v301-stability
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stability-v3.0.1-20260929
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Prepare integrity manifest
        run: python scripts/prepare_stability_v301.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest==8.4.2
      - name: Full regression and MCP protocol verification
        run: |
          python scripts/check_config.py --manifest
          python tests/regression_r0.py
          python tests/offline_check.py
          python -m pytest -q --maxfail=3
          python tests/protocol_smoke.py
      - name: Commit generated manifest
        run: |
          git config user.name 'uijeong-release-validation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release_manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'v3.0.1: refresh tested stability manifest'
            git push origin HEAD:stability-v3.0.1-20260929
          fi
