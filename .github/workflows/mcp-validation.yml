name: MCP validation

on:
  push:
    branches:
      - main
      - 'upgrade-*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements.txt pytest==8.4.2
      - name: Verify release manifest
        run: python scripts/check_config.py --manifest
      - name: Check parser regressions
        run: |
          python tests/regression_r0.py
          python tests/offline_check.py
      - name: Validate evidence, security and OpenAI contracts
        run: python -m pytest -q
      - name: Real stdio and HTTP protocol
        run: python tests/protocol_smoke.py
