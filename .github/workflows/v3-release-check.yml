name: v3 release verification
on:
  push:
    branches: [upgrade-v3-release-20260928]
    paths:
      - 'v3_reliability.py'
      - 'tests/test_v3_reliability.py'
      - 'scripts/apply_v3_release.py'
      - '.github/workflows/v3-release-check.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v3-reviewed-release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade-v3-release-20260928
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply guarded patch and regenerate integrity manifest
        run: python scripts/apply_v3_release.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest==8.4.2
      - name: Full regression and protocol verification
        run: |
          python scripts/check_config.py --manifest
          python tests/regression_r0.py
          python tests/offline_check.py
          python -m pytest -q --maxfail=3
          python tests/protocol_smoke.py
      - name: Commit tested generated integration only to release branch
        run: |
          git config user.name 'uijeong-release-validation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uijeong_mcp.py public_server.py council_extensions.py council_v29.py release_info.py release_manifest.json v3_reliability.py
          if git diff --cached --quiet; then
            echo 'No generated integration changes.'
          else
            git commit -m 'v3.0: apply tested reliability integration and integrity manifest'
            git push origin HEAD:upgrade-v3-release-20260928
          fi
