name: v4.1 manifest refresh
on:
  push:
    branches:
      - 'v4.1*'
    paths:
      - '**.py'
      - 'requirements.txt'
      - '.github/workflows/v410-manifest-refresh.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v41-manifest-refresh-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest==8.4.2
      - name: Rebuild reproducible manifest and source contract
        run: python scripts/build_manifest.py
      - name: Verify regenerated manifest
        run: python scripts/check_config.py --manifest
      - name: Run focused query/evidence tests
        run: python -m pytest -q tests/test_query_orchestration_v410.py
      - name: Commit generated integrity files
        run: |
          git config user.name 'uijeong-release-validation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release_manifest.json docs/source-tool-contracts.json
          if git diff --cached --quiet; then
            echo 'Manifest already current.'
          else
            git commit -m 'v4.1: regenerate tested release manifest'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
