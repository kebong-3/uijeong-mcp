name: MCP validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install actual runtime SDK
        run: python -m pip install -r requirements.txt pytest==8.4.2
      - name: Check parser regressions
        run: |
          python tests/regression_r0.py
          python tests/offline_check.py
      - name: Validate evidence and security boundaries
        run: python -m pytest -q
      - name: Real stdio and HTTP protocol
        run: python tests/protocol_smoke.py
