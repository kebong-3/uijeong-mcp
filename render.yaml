services:
  - type: web
    name: uijeong-mcp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/check_config.py --http --manifest && python uijeong_mcp.py --http
    healthCheckPath: /healthz
    envVars:
      - key: CLIK_API_KEY
        sync: false
      - key: LAW_OC
        sync: false
      - key: FINANCE365_SERVICE_KEY
        sync: false
      - key: FINANCE365_API_URL
        sync: false
      - key: CLIK_BASE_URL
        value: https://clik.nanet.go.kr/openapi
      - key: UIJEONG_PROFILE
        value: core
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: UIJEONG_BIND_HOST
        value: 0.0.0.0
      - key: UIJEONG_ALLOWED_HOSTS
        value: uijeong-mcp.onrender.com
      - key: UIJEONG_ALLOWED_ORIGINS
        value: https://chatgpt.com,https://chat.openai.com
      - key: UIJEONG_AUTH_MODE
        value: public
      - key: UIJEONG_PUBLIC_READONLY
        value: "true"
      - key: UIJEONG_MAX_RESPONSE_CHARS
        value: "30000"
      - key: UIJEONG_CACHE_MAX_ENTRIES
        value: "200"
      - key: UIJEONG_SITE_CACHE_MAX_ENTRIES
        value: "60"
      - key: UIJEONG_SNAPSHOT_MAX_ENTRIES
        value: "200"
      - key: UIJEONG_SNAPSHOT_MAX_TOTAL_BYTES
        value: "67108864"
# Explicit anonymous public queries. The CLIK API key remains server-side.
# Public launcher registers 18 curated read-only tools for employee workflows.
# Existing bearer/oauth/local paths remain available in the protected launcher.
# Free instances sleep; ephemeral storage and quota counters reset on redeploy.
# A retained UIJEONG_BEARER_TOKEN is ignored only in explicit public mode.

# LAW_OC: 국가법령정보 공동활용 API 인증값(OC)
# FINANCE365_SERVICE_KEY: 공공데이터포털 지방재정365 서비스키
# FINANCE365_API_URL: 활용신청 승인 화면의 실제 요청 URL
