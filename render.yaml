services:
  - type: web
    name: uijeong-mcp
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/check_config.py --http --manifest && python uijeong_mcp.py --http
    healthCheckPath: /healthz
    envVars:
      - key: CLIK_API_KEY
        sync: false
      - key: LAW_OC
        fromService:
          type: web
          name: jachi-mcp
          envVarKey: LAW_OC
      - key: LOFIN_API_KEY
        fromService:
          type: web
          name: local-budget-mcp
          envVarKey: LOFIN_API_KEY
      - key: DATA_GO_KR_SERVICE_KEY
        fromService:
          type: web
          name: local-budget-mcp
          envVarKey: DATA_GO_KR_SERVICE_KEY
      - key: KOSIS_API_KEY
        fromService:
          type: web
          name: local-budget-mcp
          envVarKey: KOSIS_API_KEY
      - key: FINANCE365_SERVICE_KEY
        sync: false
      - key: FINANCE365_API_URL
        value: https://www.lofin365.go.kr/lf/hub/QWGJK
      - key: DATA_GO_KR_SEARCH_KEY
        sync: false
      - key: DATA_GO_KR_SEARCH_URL
        value: https://apis.data.go.kr/AAAAAAA/GetSearchDataList/v2/search
      - key: CLIK_BASE_URL
        value: https://clik.nanet.go.kr/openapi
      - key: UIJEONG_PROFILE
        value: core
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: UIJEONG_BIND_HOST
        value: 0.0.0.0
      - key: UIJEONG_ALLOWED_HOSTS
        value: uijeong-mcp.onrender.com
      - key: UIJEONG_ALLOWED_ORIGINS
        value: https://chatgpt.com,https://chat.openai.com
      - key: UIJEONG_AUTH_MODE
        value: public
      - key: UIJEONG_PUBLIC_READONLY
        value: "true"
      - key: UIJEONG_MAX_RESPONSE_CHARS
        value: "30000"
      - key: UIJEONG_CACHE_MAX_ENTRIES
        value: "200"
      - key: UIJEONG_SNAPSHOT_MAX_ENTRIES
        value: "200"
      - key: UIJEONG_SNAPSHOT_MAX_TOTAL_BYTES
        value: "67108864"
# Explicit anonymous public queries. The CLIK API key remains server-side.
# One transport hosts council, budget and ordinance tools directly. No proxy to sleeping services.
# Existing bearer/oauth/local paths remain available in the protected launcher.
# Preserve the user-selected paid instance. Existing source services provide env values at Blueprint sync only.
# A retained UIJEONG_BEARER_TOKEN is ignored only in explicit public mode.

# LAW_OC: 국가법령정보 공동활용 API 인증값(OC)
# LOFIN_API_KEY: 지방재정365 개발자공간에서 발급받는 OpenAPI 인증키(권장)
# FINANCE365_SERVICE_KEY: 이전 배포 호환용 키 이름(선택)
# FINANCE365_API_URL: 세부사업별 세출현황 QWGJK endpoint (기본값 설정됨)

# DATA_GO_KR_SEARCH_KEY: 공공데이터포털 검색서비스 인증키(메타데이터 Discovery 전용)
# DATA_GO_KR_SEARCH_URL: 공공데이터포털 검색서비스 /search endpoint
