services:
  - type: web
    name: uijeong-mcp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/check_config.py --http --manifest && python uijeong_mcp.py --http
    healthCheckPath: /healthz
    envVars:
      - key: CLIK_API_KEY
        sync: false
      # work = 18 tools; core = 5, lite = 26, full = 38.
      - key: UIJEONG_PROFILE
        value: work
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: UIJEONG_BIND_HOST
        value: 0.0.0.0
      - key: UIJEONG_ALLOWED_HOSTS
        sync: false
      - key: UIJEONG_AUTH_MODE
        value: oauth_local
      - key: UIJEONG_RESOURCE_URL
        value: https://uijeong-mcp.onrender.com/mcp
      - key: UIJEONG_OAUTH_ADMIN_PASSWORD_HASH
        sync: false
      - key: UIJEONG_BEARER_TOKEN
        generateValue: true
      # Keep one tool result inside the model's context window.
      - key: UIJEONG_MAX_RESPONSE_CHARS
        value: "30000"
      # Memory guard: every cache entry can contain a whole meeting record.
      # Size for the actual instance memory and measured workload.
      - key: UIJEONG_CACHE_MAX_ENTRIES
        value: "200"
      - key: UIJEONG_SITE_CACHE_MAX_ENTRIES
        value: "60"
# For durability, provision persistent storage and set UIJEONG_STATE_DB.
# Without it the free plan's ephemeral disk loses snapshots and the call budget
# on every redeploy; evidence paging then needs a fresh search.
# Private single-operator OAuth login; anonymous MCP requests remain denied.
# Existing UIJEONG_BEARER_TOKEN is used ONLY as a signing seed in oauth_local.
# For organization-wide SSO use render.oauth.yaml and a reviewed external provider.
